# Highlands: a 4 km continent of mountain ranges, terraced in part, weathered by erosion.
# Keys left out take their defaults (worldgen.proc_gen.world.config documents them all).

version: 1
world:
  cell_size: 1.0
  size_cells: 4096
elevation:
  mask: continent
  shore: 0.12
  max_height: 520.0
  sea_floor: -40.0
  noise: {octaves: 7, frequency: 0.0008}  # hills about a kilometre across
  warp: {strength: 160.0, frequency: 0.0006}
  mountains:
    enabled: true
    wavelength: 700.0
    octaves: 7
    gain: 0.5
    sharpness: 2.0
    height: 0.65
    coverage: 0.4
    range_wavelength: 2400.0
  terraces:
    enabled: true
    step: 18.0
    sharpness: 0.75
    where: noise
    wavelength: 1400.0
    coverage: 0.25
erosion:
  enabled: true
  levels: 3
  droplets: 1.0
  thermal_iterations: 40
hydrology:
  river_threshold: 20000.0
  carve_depth: 3.0
climate:
  base_temperature: 14.0
  latitude_gradient: 8.0
  lapse_rate: 45.0  # snow on the upper third of the peaks
  moisture: {water_distance: 120.0}
biomes:
  relief_radius: 80.0
  rules:
  - id: sea_floor
    when: {water: sea}
    ground: {color: [150, 140, 105]}
  - id: lake_bed
    when: {water: lake}
    ground: {color: [96, 92, 70]}
  - id: riverbed
    when: {water: river}
    ground: {color: [110, 100, 78]}
  - id: beach
    when: {elevation: [-1.0, 1.5], slope: [0.0, 20.0]}
    ground: {color: [205, 190, 140], jitter: 0.04}
  - id: snow
    when: {temperature: [-50.0, -2.0]}
    ground: {color: [235, 238, 242]}
  - id: rock  # steep and bare: what erosion cut, and the terraces' cliffs
    when: {slope: [40.0, 90.0], sediment: [0.0, 0.3]}
    ground: {color: [118, 112, 104], jitter: 0.06}
  - id: scree  # steep with loose stone on it: the feet of cliffs
    when: {slope: [28.0, 90.0]}
    ground: {color: [150, 144, 132], jitter: 0.08}
  - id: alluvial  # flat valley floors where erosion laid down its sediment
    when: {slope: [0.0, 10.0], sediment: [1.0, 1000.0], temperature: [2.0, 30.0]}
    ground: {color: [98, 150, 70], jitter: 0.06}
  - id: alpine  # cold high ground below the snow
    when: {temperature: [-2.0, 3.0]}
    ground: {color: [128, 140, 96], jitter: 0.07}
  - id: forest
    when: {temperature: [2.0, 25.0], moisture: [0.5, 1.0]}
    ground: {color: [78, 118, 60], jitter: 0.07}
  - id: grassland
    when: {moisture: [0.2, 0.5]}
    ground: {color: [112, 152, 82], jitter: 0.07}
  - id: default
    ground: {color: [112, 152, 82], jitter: 0.07}
