# Install the hooks once with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      # The project's own ruff (pinned in uv.lock), with the config in pyproject.toml
      - id: ruff
        name: ruff (lint and autofix)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
