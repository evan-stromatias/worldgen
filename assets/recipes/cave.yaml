# The default subterranean cave recipe: 1 km square at 1 m cells.
# Floor is procedurally generated with gradient noise, mountain ridge crests, and terracing.
# Ceiling is the floor rotated 180° with clearance and inverted dome/stalactite scaling.
# Passing cells with clearance < min_passage become solid natural rock pillars.
version: 0.3.0
world:
  cell_size: 1.0        # metres per cell
  patch_cells: 128      # cells per patch side
  size_cells: 1024      # cells per side
  sea_level: 0.0        # reference sea level
elevation:
  mask: continent       # continent gives continuous subterranean floor
  falloff: 0.0          # 0 = floor to the edges
  shore: 0.08
  max_height: 120.0     # vertical relief of floor hills
  sea_floor: -20.0      # deep subterranean rift valleys
  noise:
    octaves: 5
    frequency: 0.003    # broad rolling swells
    lacunarity: 2.0
    gain: 0.5
  warp:
    strength: 70.0      # domain warping to bend hills into winding ridges
    frequency: 0.002
  mountains:
    enabled: true       # adds sharp subterranean ridges and crests
    wavelength: 250.0   # ridge crest spacing in metres
    height: 0.65        # share of max_height for mountain ridges
    coverage: 0.40      # mountain ridge density
    sharpness: 1.8      # defined ridgelines
  terraces:
    enabled: false
erosion:
  enabled: false
cavern:
  clearance: 40.0       # nominal vertical distance between floor and ceiling, metres
  ceiling_mode: inverted # inverted: valleys become domes, ridges become stalactites; offset: direct offset
  ceiling_scale: 0.75   # scale factor for ceiling relief
  min_passage: 3.0      # below this clearance (metres), cells fuse into solid rock pillars
  perimeter_wall: true  # seal outer boundaries as solid rock walls
  wall_thickness: 2     # thickness of perimeter wall, in cells
hydrology:
  enabled: true
  water_table: -5.0     # subterranean aquifer height, metres
climate:
  temperature_base: 10.0 # ambient cave temperature, °C
  geothermal_gradient: 0.03 # °C per metre of depth
  ambient_humidity: 0.80 # ambient relative humidity (0-1)
materials:
  blend_width: 0.08
  relief_radius: 40.0
  rules:
  - id: sump
    when: {water: lake}
    ground: {color: [45, 65, 90], jitter: 0.02}
  - id: flowstone
    when: {slope: [40.0, 90.0]}
    ground: {color: [220, 215, 200], jitter: 0.03}
  - id: crystal_vault
    when: {relief: [35.0, 200.0]}
    ground: {color: [180, 215, 235], jitter: 0.05}
  - id: fungal_grotto
    when: {moisture: [0.85, 1.0], temperature: [12.0, 40.0]}
    ground: {color: [60, 130, 85], jitter: 0.06}
  - id: limestone
    ground: {color: [130, 125, 120], jitter: 0.05}
client: {}
